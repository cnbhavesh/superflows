events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Include all conf files
    include /etc/nginx/conf.d/*.conf;
}

# Stream module for TCP proxy (Kafka)
stream {
    log_format kafka_format '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time "$upstream_addr"';
    access_log /var/log/nginx/kafka_access.log kafka_format;

    # Rate limiting
    limit_conn_zone $binary_remote_addr zone=kafka_conn_zone:10m;
    
    # Kafka broker proxy
    upstream kafka_backend {
        server kafka:9093;
    }

    server {
        listen 9093;
        proxy_pass kafka_backend;
        proxy_timeout 1s;
        proxy_responses 1;
        proxy_bind $remote_addr transparent;
        
        # Connection limiting
        limit_conn kafka_conn_zone 10;
        
        # Allow specific IPs only (configure as needed)
        # allow 192.168.1.0/24;
        # allow 10.0.0.0/8;
        # deny all;
    }
}